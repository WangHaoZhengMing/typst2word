[package]
name = "compiler"
version.workspace = true
edition.workspace = true
description = "Self-contained Typst 0.15 compiler, World implementation, and dual semantic/layout query engine"

[dependencies]
comemo.workspace = true
ecow.workspace = true
flate2.workspace = true
parking_lot.workspace = true
typst.workspace = true
typst-eval.workspace = true
typst-html.workspace = true
typst-layout.workspace = true
typst-library.workspace = true
typst-realize.workspace = true
typst-syntax.workspace = true
typst-utils.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
typst-kit = { workspace = true, default-features = true, features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
typst-kit = { workspace = true, features = ["embedded-fonts"] }
