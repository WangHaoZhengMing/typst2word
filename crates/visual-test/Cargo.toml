[package]
name = "visual-test"
version.workspace = true
edition.workspace = true
publish = false
autobins = false
description = "Atomic single-variable (margin: 10pt) Typst-to-Word IR & visual test suite + gpui-kit desktop inspector"

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]

[[bin]]
name = "visual-test-cli"
path = "src/bin/visual_test_cli.rs"

[[bin]]
name = "visual-test-gui"
path = "src/bin/visual_test_gui.rs"
required-features = ["gui"]

[dependencies]
compiler.workspace = true
docx-writer.workspace = true
extract.workspace = true
gpui-kit = { version = "0.9.1", features = ["syntect"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
ir.workspace = true
rayon = "1.10"
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
typst-pdf.workspace = true
word-construct.workspace = true
zip.workspace = true
