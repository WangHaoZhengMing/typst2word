[package]
name = "visual-test"
version = "0.2.2"
edition = "2024"
autobins = false
description = "Atomic single-variable (margin: 10pt) Typst-to-Word IR & visual test suite + gpui-kit desktop inspector"

[features]
default = []
gui = ["dep:gpui-kit"]

[[bin]]
name = "visual-test-cli"
path = "src/bin/visual_test_cli.rs"

[dependencies]
typst2word = { path = "../.." }
compiler = { path = "../compiler" }
extract = { path = "../extract" }
ir = { path = "../ir" }
word-construct = { path = "../word-construct" }
docx-writer = { path = "../docx-writer" }
typst-pdf = "0.15.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
gpui-kit = { version = "0.9.1", features = ["syntect"], optional = true }
