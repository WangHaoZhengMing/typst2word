[package]
name = "typst2word-wasm"
version = "0.2.3"
edition = "2024"
description = "WebAssembly (wasm-bindgen) bindings for typst2word: in-memory virtual workspace, @preview package loader, live SVG preview, and .docx export"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
comemo = "0.5.1"
compiler = { path = "../compiler" }
docx-writer = { path = "../docx-writer" }
extract = { path = "../extract" }
ir = { path = "../ir" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typst = "0.15.1"
typst-svg = "0.15.1"
typst-syntax = "0.15.1"
wasm-bindgen = "0.2"
word-construct = { path = "../word-construct" }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
