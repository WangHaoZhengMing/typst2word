[package]
name = "typst2word-wasm"
version.workspace = true
edition.workspace = true
publish = false
description = "WebAssembly (wasm-bindgen) bindings for typst2word: in-memory virtual workspace, @preview package loader, live SVG preview, and .docx export"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
comemo.workspace = true
compiler.workspace = true
docx-writer.workspace = true
extract.workspace = true
ir.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
typst.workspace = true
typst-svg.workspace = true
typst-syntax.workspace = true
wasm-bindgen = "0.2"
word-construct.workspace = true
zip.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"

[dev-dependencies]
flate2.workspace = true
