name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.2)"
        required: false
        default: "v0.2.2"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_name: typst2word
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin_name: typst2word
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_name: typst2word
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin_name: typst2word
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_name: typst2word.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin typst2word

      - name: Package Unix archive (.tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/
          tar -C dist -czf "typst2word-${{ matrix.target }}.tar.gz" "${{ matrix.bin_name }}"
          shasum -a 256 "typst2word-${{ matrix.target }}.tar.gz" > "typst2word-${{ matrix.target }}.tar.gz.sha256"

      - name: Package Windows archive (.zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination dist/
          Compress-Archive -Path "dist/${{ matrix.bin_name }}" -DestinationPath "typst2word-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "typst2word-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  typst2word-${{ matrix.target }}.zip" | Out-File -Encoding ascii "typst2word-${{ matrix.target }}.zip.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst2word-${{ matrix.target }}
          path: |
            typst2word-${{ matrix.target }}.${{ matrix.archive }}
            typst2word-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.2.0' }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
