[workspace]
members = [
    ".",
    "crates/ir",
    "crates/compiler",
    "crates/extract",
    "crates/word-construct",
    "crates/docx-writer",
]
default-members = ["."]

[package]
name = "typst2word"
version = "0.2.2"
edition = "2024"

[dependencies]
compiler = { path = "crates/compiler" }
docx-writer = { path = "crates/docx-writer" }
extract = { path = "crates/extract" }
ir = { path = "crates/ir" }
word-construct = { path = "crates/word-construct" }
serde_json = "1.0"

[dev-dependencies]
roxmltree = "0.21.1"
tempfile = "3.8"
zip = "9.4.2"

