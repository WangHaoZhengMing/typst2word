[workspace]
resolver = "3"
members = [
    ".",
    "crates/ir",
    "crates/compiler",
    "crates/extract",
    "crates/word-construct",
    "crates/docx-writer",
    "crates/wasm",
    "crates/visual-test",
]
default-members = ["."]

[workspace.package]
version = "0.2.8"
edition = "2024"

[workspace.dependencies]
# Internal workspace crates
ir = { path = "crates/ir" }
compiler = { path = "crates/compiler" }
extract = { path = "crates/extract" }
word-construct = { path = "crates/word-construct" }
docx-writer = { path = "crates/docx-writer" }

# Typst crates
typst = "0.15.1"
typst-eval = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false }
typst-layout = "0.15.1"
typst-library = "0.15.1"
typst-pdf = "0.15.1"
typst-realize = "0.15.1"
typst-svg = "0.15.1"
typst-syntax = "0.15.1"
typst-utils = "0.15.1"

# Shared third-party crates
comemo = "0.5.1"
ecow = "0.2.6"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
parking_lot = "0.12"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[package]
name = "typst2word"
version.workspace = true
edition.workspace = true

[dependencies]
compiler.workspace = true
docx-writer.workspace = true
extract.workspace = true
ir.workspace = true
serde_json.workspace = true
word-construct.workspace = true

[dev-dependencies]
roxmltree.workspace = true
tempfile = "3.8"
zip.workspace = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"


