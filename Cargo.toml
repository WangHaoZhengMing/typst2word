[workspace]
members = [".", "crates/word-construct"]
default-members = ["."]

[package]
name = "typst2word"
version = "0.2.0"
edition = "2024"

[dependencies]
word-construct = { path = "crates/word-construct" }
chrono = "0.4.44"
comemo = "0.5.1"
dirs = "7.0.0"
docx-rs = "0.4.20"
ecow = "0.2.6"
flate2 = "1.1.9"
parking_lot = "0.12"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.44"
zip = "9.4.2"

#Typst
typst = "0.15.1"
typst-eval = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
typst-library = "0.15.1"
typst-realize = "0.15.1"
typst-svg = "0.15.1"
typst-syntax = "0.15.1"
typst-utils = "0.15.1"



[dev-dependencies]
tempfile = "3.8"

